@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
.sh{--ink:#16233A;--navy:#13294B;--navy2:#1E3C68;--teal:#167F84;--teal-b:#2FB3B8;--teal-s:#E2F1F1;--amber:#B85A16;--amber-b:#E58A45;--amber-s:#FBEEE2;--red:#AE3A33;--red-s:#F9E7E5;--line:#DCE3E9;--muted:#5D6B7A;--canvas:#F2F5F8;--paper:#FFFFFF;
display:flex;min-height:100vh;background:var(--canvas);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.5}
.sh *{box-sizing:border-box}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:.92em}
.sm{font-size:12.5px}
.sh-muted{color:var(--muted)}
.sh-side{width:224px;flex-shrink:0;background:var(--navy);color:#DCE6F2;display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh}
.sh-brand{display:flex;gap:10px;align-items:center;padding:0 6px 22px}
.sh-brand-name{font-weight:700;font-size:17px;color:#fff;letter-spacing:.2px}
.sh-brand-sub{font-size:12px;color:#9FB4CC}
.sh-nav{display:flex;flex-direction:column;gap:2px}
.sh-nav-item{display:flex;justify-content:space-between;align-items:center;background:none;border:0;color:#C9D7E6;text-align:left;padding:9px 10px;border-radius:6px;font:inherit;cursor:pointer}
.sh-nav-item:hover{background:#1C3760;color:#fff}
.sh-nav-item.is-on{background:#22426F;color:#fff;font-weight:600}
.sh-count{background:var(--amber-b);color:#2B1400;font-size:12px;font-weight:700;border-radius:10px;padding:0 7px;min-width:20px;text-align:center}
.sh-count.is-alert{background:#E5675E;color:#fff}
.sh-side-foot{margin-top:auto;font-size:12px;color:#93A8C1;padding:0 6px}
.sh-side-foot p{margin:0 0 8px}
.sh-side-foot .sh-link{color:#9FD9DB}
.sh-main{flex:1;min-width:0;padding:28px 32px 48px;max-width:1280px}
.sh-head{margin-bottom:18px}
.sh-head h1{font-size:26px;font-weight:600;margin:0 0 4px;color:var(--navy)}
.sh-head p{margin:0;color:var(--muted);max-width:70ch}
.sh-panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:18px;min-width:0}
.sh-panel h2{font-size:16px;font-weight:600;margin:0 0 12px}
.sh h3{font-size:14px;font-weight:600;margin:0 0 8px}
.sh-grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}
.sh-grid2.tight{gap:22px;margin:16px 0}
@media (max-width:960px){.sh-grid2,.sh-approve{grid-template-columns:1fr!important}.sh-side{width:180px}.sh-main{padding:20px}}
.sh-btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:7px;padding:8px 14px;cursor:pointer}
.sh-btn:hover:not(:disabled){border-color:#AEBDCA;background:#F7F9FB}
.sh-btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.sh-btn.primary:hover:not(:disabled){background:#126C70}
.sh-btn.danger{color:var(--red);border-color:#E3B8B4}
.sh-btn.danger:hover:not(:disabled){background:var(--red-s)}
.sh-btn.sm{padding:5px 10px;font-size:13px}
.sh-btn:disabled{opacity:.45;cursor:not-allowed}
.sh-link{background:none;border:0;padding:0;font:inherit;color:var(--teal);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.sh :focus-visible{outline:2px solid var(--amber-b);outline-offset:2px}
.sh-seg{display:inline-flex;background:var(--canvas);border:1px solid var(--line);border-radius:8px;padding:3px;margin-bottom:16px}
.sh-seg button{font:inherit;border:0;background:none;padding:6px 14px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:500}
.sh-seg button.is-on{background:var(--paper);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(19,41,75,.12)}
.sh-form{display:flex;flex-direction:column;gap:14px}
.sh-radio{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.sh-radio legend{font-weight:600;margin-bottom:6px}
.sh-radio label{display:flex;gap:8px;align-items:baseline;cursor:pointer}
.sh-labelrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sh-labelrow label{font-weight:600}
.sh textarea,.sh input:not([type=checkbox]):not([type=radio]),.sh select{font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:#fff;width:100%}
.sh textarea{resize:vertical;line-height:1.45}
.sh textarea:focus,.sh input:focus,.sh select:focus{border-color:var(--teal-b);outline:none;box-shadow:0 0 0 3px var(--teal-s)}
.sh-subhead{font-weight:600}
.sh-extend{display:flex;flex-direction:column;gap:6px;background:var(--canvas);border-radius:8px;padding:12px 14px}
.sh-checks{display:flex;flex-wrap:wrap;gap:6px 16px}
.sh-check{display:flex;gap:6px;align-items:center;cursor:pointer}
.sh-chat{display:flex;flex-direction:column;gap:10px}
.sh-chat-log{height:330px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px}
.sh-msg{max-width:88%;padding:9px 12px;border-radius:10px;white-space:pre-wrap;word-break:break-word}
.sh-msg.user{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:3px;max-height:160px;overflow:auto}
.sh-msg.assistant{align-self:flex-start;background:var(--teal-s);border-bottom-left-radius:3px}
.sh-chat-starters{display:flex;gap:6px;flex-wrap:wrap}
.sh-chip{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:4px 11px;cursor:pointer;color:var(--ink)}
.sh-chip:hover{border-color:var(--teal-b)}
.sh-chat-in{display:flex;gap:8px;align-items:flex-end}
.sh-empty{color:var(--muted);margin:4px 0 12px}
.sh-runs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.sh-runs li{border-top:1px solid var(--line);padding:2px 0 6px}
.sh-runs li:first-child{border-top:0}
.sh-runrow{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;width:100%;background:none;border:0;font:inherit;color:inherit;text-align:left;padding:8px 4px;cursor:pointer;border-radius:6px}
.sh-runrow:hover{background:var(--canvas)}
.sh-runmeta{display:flex;flex-direction:column;gap:3px;min-width:0}
.sh-rail{display:flex;gap:3px}
.dot{width:9px;height:9px;border-radius:2px;background:#DDE4EA;display:inline-block}
.dot.n-done{background:var(--teal-b)}.dot.n-active{background:var(--navy2)}.dot.n-waiting{background:var(--amber-b)}.dot.n-failed,.dot.n-rejected{background:#E5675E}.dot.n-returned{background:var(--amber)}.dot.n-skipped{background:#EEF1F4;outline:1px dashed #C5CFD8}
.sh-pill{font-size:12px;font-weight:600;border-radius:12px;padding:2px 9px;white-space:nowrap;background:#E8EDF2;color:var(--muted)}
.st-running{background:#E2EAF5;color:var(--navy2)}.st-awaiting,.st-returned{background:var(--amber-s);color:var(--amber)}.st-blocked,.st-rejected{background:var(--red-s);color:var(--red)}.st-completed{background:var(--teal-s);color:var(--teal)}
.sh-approve{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;align-items:start}
.sh-queue ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.sh-qitem{display:flex;gap:10px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:8px;font:inherit;color:inherit;cursor:pointer}
.sh-qitem .mono{white-space:nowrap}
.sh-qitem>span:last-child{display:flex;flex-direction:column;min-width:0}
.sh-qitem b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-qitem:hover{background:var(--canvas)}
.sh-qitem.is-on{background:var(--amber-s);border-color:#F0CDAE}
.sh-review-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.sh-review-head h2{margin-bottom:2px}
.sh-review-head p{margin:0 0 8px}
.sh-source{background:var(--canvas);border-radius:8px;padding:12px;white-space:pre-wrap;font-family:'IBM Plex Mono',monospace;font-size:12.5px;margin:8px 0;max-height:220px;overflow:auto}
.sh-table{width:100%;border-collapse:collapse}
.sh-table .mono,.sh-table td.sm:first-child{white-space:nowrap}
.sh-table th{text-align:left;font-size:12.5px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line);padding:6px 8px}
.sh-table td{border-bottom:1px solid #EDF1F4;padding:7px 8px;vertical-align:top}
.sh-table tr.has-err td{background:#FDF5F4}
.sh-table tr.is-new td{background:#F1F9F9}
.sh-fields{margin-top:10px}
.sh-fields td:first-child{width:170px}
.sh-fields td:nth-child(2){width:300px}
.sh-fields td:nth-child(3){width:120px}
.sh-fields tr.has-warn td{background:#FFFAF4}
.req{color:var(--red)}
.sh-src{font-size:12.5px;color:var(--muted);font-style:italic;word-break:break-word}
.sh-tag{display:inline-block;font-size:11.5px;font-weight:600;border-radius:4px;padding:0 6px;margin-top:4px;margin-right:4px}
.sh-tag.edited{background:#E2EAF5;color:var(--navy2)}.sh-tag.rule{background:#EEF1F4;color:var(--muted)}
.sh-inline{font-size:12.5px;margin-top:4px;padding-left:10px;position:relative}
.sh-inline::before{content:'';position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:50%}
.sh-inline.error{color:var(--red)}.sh-inline.error::before{background:var(--red)}
.sh-inline.warning{color:var(--amber)}.sh-inline.warning::before{background:var(--amber-b)}
.sh-conf{display:flex;align-items:center;gap:6px;font-size:12.5px}
.sh-conf .bar{width:54px;height:6px;background:#E8EDF2;border-radius:3px;overflow:hidden}
.sh-conf .bar i{display:block;height:100%}
.sh-conf.hi .bar i{background:var(--teal-b)}.sh-conf.mid .bar i{background:var(--amber-b)}.sh-conf.lo .bar i{background:#E5675E}
.sh-dups{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.sh-dups li{display:flex;flex-direction:column;background:var(--amber-s);border-radius:7px;padding:7px 10px}
.sh-details{margin-top:8px}
.sh-details summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--teal)}
.sh-details ul{margin:6px 0 0;padding-left:18px}
.sh-decide{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.sh-decide label{font-weight:600}
.sh-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sh-summary{display:flex;gap:22px;flex-wrap:wrap;margin:-6px 0 14px;color:var(--muted)}
.sh-summary b{color:var(--ink);font-size:18px;margin-right:3px}
.sh-runbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.sh-runbar select{width:auto;min-width:260px}
.sh-graph{overflow-x:auto;background:var(--canvas);border-radius:8px;padding:6px}
.sh-graph svg{display:block}
.edge{fill:none;stroke:#BFCBD6;stroke-width:1.5}
.edge.done{stroke:var(--teal-b)}
.node{cursor:pointer}
.node rect{fill:#fff;stroke:#C9D4DE;stroke-width:1.2}
.node .t1{font-size:12px;font-weight:600;fill:var(--ink);font-family:'IBM Plex Sans',sans-serif}
.node .t2{font-size:11px;fill:var(--muted);font-family:'IBM Plex Sans',sans-serif}
.node.n-done rect{fill:var(--teal-s);stroke:var(--teal-b)}
.node.n-done .t2{fill:var(--teal)}
.node.n-active rect{fill:#fff;stroke:var(--navy2);stroke-width:2}
.node.n-active{animation:shpulse 1.2s ease-in-out infinite}
.node.n-waiting rect{fill:var(--amber-s);stroke:var(--amber-b);stroke-width:2}
.node.n-waiting .t2{fill:var(--amber)}
.node.n-failed rect,.node.n-rejected rect{fill:var(--red-s);stroke:#E5675E;stroke-width:2}
.node.n-failed .t2,.node.n-rejected .t2{fill:var(--red)}
.node.n-returned rect{fill:var(--amber-s);stroke:var(--amber)}
.node.n-skipped rect{fill:#F6F8FA;stroke-dasharray:4 3}
.node.n-skipped .t1{fill:#98A5B2}
.node.human.n-pending rect{stroke:#EBC29F}
.node.is-sel rect{stroke:var(--navy);stroke-width:2.5}
@keyframes shpulse{50%{opacity:.6}}
@media (prefers-reduced-motion:reduce){.node.n-active{animation:none}}
.sh-nodeinfo{margin-top:10px;min-height:44px}
.sh-nodeinfo div{margin-top:2px}
.sh-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:1100px){.sh-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sh-metric{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.sh-metric.is-alert{border-color:#E8A9A3;background:#FFF9F8}
.sh-metric ul{margin:0;padding-left:16px}
.sh-metric p{margin:0}
.sh-metric .sh-btn{margin-top:8px}
.sh-big{font-size:34px;font-weight:600;color:var(--navy);line-height:1.1}
.sh-progress{height:8px;background:#E8EDF2;border-radius:4px;overflow:hidden;margin:8px 0 6px}
.sh-progress i{display:block;height:100%;background:var(--teal-b);transition:width .4s}
.sh-health{font-size:18px;font-weight:600;text-transform:capitalize;margin-bottom:4px}
.h-ontrack{color:var(--teal)}.h-atrisk{color:var(--amber)}.h-breached{color:var(--red)}
.sh-agents{list-style:none;padding:0!important;display:flex;flex-direction:column;gap:7px}
.sh-agents li{display:flex;gap:8px;align-items:flex-start}
.sh-agents li>span:last-child{display:flex;flex-direction:column;min-width:0}
.sh-state{font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;min-width:54px;text-align:center;margin-top:2px}
.s-idle{background:#EEF1F4;color:var(--muted)}.s-busy{background:#E2EAF5;color:var(--navy2)}.s-waiting{background:var(--amber-s);color:var(--amber)}.s-error{background:var(--red-s);color:var(--red)}
.sh-switch{display:flex;gap:8px;align-items:center;cursor:pointer;font-size:13px}
.sh-mode{font-size:11.5px;font-weight:600;border-radius:4px;padding:1px 7px}
.m-read{background:#EEF1F4;color:var(--muted)}.m-stage{background:var(--amber-s);color:var(--amber)}.m-commit{background:var(--teal-s);color:var(--teal)}
.sh-scroll{max-height:420px;overflow:auto}
.sh-scroll.short{max-height:280px}
.sh-strike{text-decoration:line-through;color:var(--muted)}
.sh-toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;box-shadow:0 6px 20px rgba(19,41,75,.25);font-weight:500;z-index:10}
